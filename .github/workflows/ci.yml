name: CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@9.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository validation
        run: pnpm repo:check

      - name: Repository unit tests
        run: node --test tests/repository/repository-governance.test.mjs

      - name: Configuration validation
        run: pnpm config:check

      - name: Configuration tests
        run: pnpm test:config

      - name: Lint
        run: pnpm run lint

      - name: Application tests
        run: pnpm run test

      - name: Build
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: postgresql://test:test@localhost:5432/cg_tourism
          JWT_SECRET: test-only-secret-that-is-at-least-32-characters
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          CORS_ORIGINS: http://localhost:3000
          LOG_LEVEL: info
        run: pnpm run build
