name: CG Tourism Mobile CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'apps/backend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'apps/backend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-validation:
    name: Mobile Runtime & Cross-Package Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cg_tourism_test
          POSTGRES_USER: cg_tourism
          POSTGRES_PASSWORD: cg_tourism_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://cg_tourism:cg_tourism_dev@localhost:5432/cg_tourism_test
        run: pnpm --filter backend exec prisma generate

      - name: Mobile Typecheck
        run: pnpm --filter @cg-tourism/mobile typecheck

      - name: Mobile Unit Tests
        run: pnpm --filter @cg-tourism/mobile test

      - name: Web Lint
        run: pnpm --filter web lint

      - name: Web Build
        run: pnpm --filter web build

      - name: Backend Unit Tests
        env:
          DATABASE_URL: postgresql://cg_tourism:cg_tourism_dev@localhost:5432/cg_tourism_test
          REDIS_URL: redis://localhost:6379/0
        run: pnpm --filter backend test:unit
