name: Bug Report
description: Report a reproducible problem in CG Tourism.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Provide enough information for another developer to reproduce the problem.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: List the exact steps required to reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11 / Node 20 / pnpm 9.x"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Remove secrets and personal information before posting.
      render: shell
