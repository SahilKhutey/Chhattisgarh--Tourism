services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cg-tourism-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cg_tourism
      POSTGRES_USER: cg_tourism
      POSTGRES_PASSWORD: cg_tourism_dev_password

    ports:
      - "5432:5432"

    volumes:
      - cg_tourism_postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cg_tourism -d cg_tourism"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cg_tourism_postgres:
